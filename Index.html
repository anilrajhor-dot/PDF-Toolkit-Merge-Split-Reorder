<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Toolkit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #F4EDE2;
      margin: 0;
      color: #0E0E10;
    }
    header {
      background: #fff;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 1.5rem;
      margin: 0;
    }
    .badge {
      font-size: 0.9rem;
      background: #F5B301;
      padding: 0.3rem 0.6rem;
      border-radius: 8px;
    }
    .upload-zone {
      border: 2px dashed #ccc;
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      margin: 2rem;
      background: #fff;
      transition: border-color 0.3s;
    }
    .upload-zone.dragover {
      border-color: #F5B301;
    }
    .file-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 2rem;
    }
    .file-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 1rem;
      width: 200px;
      position: relative;
    }
    .file-card button {
      position: absolute;
      top: 8px;
      right: 8px;
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #E2582B;
    }
    .workspace {
      margin: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
    }
    .thumbnail {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 0.5rem;
      text-align: center;
      position: relative;
      transition: transform 0.2s, border 0.2s;
    }
    .thumbnail.selected {
      border: 3px solid #F5B301;
      transform: scale(1.05);
    }
    .thumbnail canvas {
      max-width: 100%;
      border-radius: 8px;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.3rem;
    }
    .controls button {
      background: #F5B301;
      border: none;
      border-radius: 6px;
      padding: 0.2rem 0.4rem;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1rem;
    }
    .toolbar button {
      background: #F5B301;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.3s;
    }
    .toolbar button:hover {
      background: #d99a01;
    }
    .toolbar button.destructive {
      background: #E2582B;
      color: #fff;
    }
    .toast {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: #0E0E10;
      color: #fff;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .toast.show {
      opacity: 1;
    }
    .progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      background: #F5B301;
      width: 0%;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <header>
    <h1>PDF Toolkit</h1>
    <div class="badge">🔒 Your files never leave your computer</div>
  </header>

  <div class="upload-zone" id="uploadZone">
    <p>Drag & Drop PDFs or Images here</p>
    <input type="file" id="fileInput" multiple accept=".pdf,.png,.jpg,.jpeg">
    <br><br>
    <button onclick="document.getElementById('fileInput').click()">Browse Files</button>
  </div>

  <div class="file-cards" id="fileCards"></div>
  <div class="toolbar" id="toolbar">
    <button onclick="mergeAll()">Merge All</button>
    <button onclick="mergeSelected()">Merge Selected</button>
    <button onclick="extractSelected()">Extract Selected</button>
    <button class="destructive" onclick="deleteSelected()">Delete Selected</button>
    <button onclick="rotateSelected()">Rotate Selected</button>
    <button onclick="selectAll()">Select All</button>
    <button onclick="deselectAll()">Deselect All</button>
    <button onclick="invertSelection()">Invert Selection</button>
    <button class="destructive" onclick="resetApp()">Reset</button>
  </div>
  <div class="workspace" id="workspace"></div>

  <div class="progress" id="progress"></div>
  <div class="toast" id="toast"></div>

<script>
/* 
  PDF Toolkit JavaScript
  All operations happen locally in the browser.
  No files are uploaded anywhere.
*/

const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const fileCards = document.getElementById('fileCards');
const workspace = document.getElementById('workspace');
const toast = document.getElementById('toast');
const progress = document.getElementById('progress');

let pages = []; // Array of page objects {canvas, rotation, selected, pdfDoc, pageIndex, filename}
let history = []; // For undo

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),3000);
}

function setProgress(val) {
  progress.style.width = val + '%';
}

uploadZone.addEventListener('dragover', e=>{
  e.preventDefault();
  uploadZone.classList.add('dragover');
});
uploadZone.addEventListener('dragleave', e=>{
  uploadZone.classList.remove('dragover');
});
uploadZone.addEventListener('drop', e=>{
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e=>{
  handleFiles(e.target.files);
});

async function handleFiles(files) {
  for (let file of files) {
    if (file.type==='application/pdf') {
      await loadPDF(file);
    } else if (file.type.startsWith('image/')) {
      await loadImageAsPDF(file);
    } else {
      showToast('Unsupported file type: '+file.name);
    }
  }
}
